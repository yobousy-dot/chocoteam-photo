<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Ma Galerie Photo Protégée</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #0d0d1a 0%, #1a0a2e 40%, #0a1628 100%);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }
    .stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
    }
    .star {
      position: absolute; width: 2px; height: 2px;
      background: white; border-radius: 50%;
      animation: twinkle 3s infinite; opacity: 0;
    }
    @keyframes twinkle { 0%,100%{opacity:0} 50%{opacity:0.6} }
    .glow {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(100,60,200,0.15) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 20%, rgba(220,80,120,0.12) 0%, transparent 50%);
    }

    /* --- CARTE MOT DE PASSE --- */
    #password-container {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      z-index: 10;
    }
    .password-card {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2.5rem 2.2rem;
      width: 360px;
      position: relative; z-index: 1;
    }
    .lock-icon {
      width: 56px; height: 56px;
      margin: 0 auto 1.2rem;
      background: linear-gradient(135deg, #7c3aed, #db2777);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.4);
    }
    .password-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px; font-weight: 700;
      color: #f5f0ff; text-align: center; margin-bottom: 0.3rem;
    }
    .password-card p.sub {
      font-size: 13px; color: rgba(200,185,255,0.6);
      text-align: center; margin-bottom: 1.8rem; letter-spacing: 0.5px;
    }
    .input-wrap { position: relative; margin-bottom: 1rem; }
    .input-wrap input {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 13px 14px 13px 44px;
      font-size: 15px; color: #f0ebff;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .input-wrap input::placeholder { color: rgba(200,185,255,0.35); }
    .input-wrap input:focus {
      border-color: rgba(167,139,250,0.6);
      box-shadow: 0 0 0 3px rgba(124,58,237,0.18);
    }
    .input-wrap input.error {
      border-color: rgba(244,63,94,0.6);
      animation: shake 0.35s ease;
    }
    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      font-size: 18px; color: rgba(200,185,255,0.4); pointer-events: none;
    }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
    .btn-submit {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 500; color: white;
      cursor: pointer; letter-spacing: 0.3px;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
      font-family: 'DM Sans', sans-serif;
    }
    .btn-submit:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 28px rgba(124,58,237,0.45); }
    .btn-submit:active { transform: translateY(0); }
    #password-error {
      font-size: 13px; color: rgba(255,160,180,0.9);
      text-align: center; margin-top: 1rem; line-height: 1.5;
      padding: 10px 14px;
      background: rgba(244,63,94,0.1);
      border: 1px solid rgba(244,63,94,0.2);
      border-radius: 10px; display: none;
    }

    /* --- GALERIE --- */
    #gallery-container {
      display: none; position: relative; z-index: 1;
      padding: 2.5rem 2rem; width: 100%; max-width: 720px;
    }
    #gallery-container h1 {
      font-family: 'Playfair Display', serif;
      font-size: 32px; color: #f5f0ff; text-align: center; margin-bottom: 0.4rem;
    }
    .gallery-sub {
      font-size: 13px; color: rgba(200,185,255,0.5);
      text-align: center; margin-bottom: 2rem;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .gallery-item {
      aspect-ratio: 1; border-radius: 14px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .gallery-item:hover {
      transform: scale(1.03);
      box-shadow: 0 12px 36px rgba(0,0,0,0.5);
    }
    .gallery-item img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="glow"></div>

  <div id="password-container">
    <div class="password-card">
      <div class="lock-icon">🔒</div>
      <h2>Galerie privée</h2>
      <p class="sub">Entrez le mot de passe pour continuer</p>
      <div class="input-wrap">
        <span class="input-icon">🗝️</span>
        <input type="password" id="password-input" placeholder="Mot de passe..."
          onkeydown="if(event.key==='Enter') checkPassword()">
      </div>
      <button class="btn-submit" onclick="checkPassword()">Accéder à la galerie →</button>
      <p id="password-error">Je sais que tu ne l'as pas fait exprès. Tout le monde peut se tromper — l'important, c'est d'avancer et de ne pas être trop dur avec toi-même. 🌷</p>
    </div>
  </div>

  <div id="gallery-container">
    <h1>Ma galerie ✨</h1>
    <p class="gallery-sub">Collection personnelle</p>
    <div class="gallery">
      <div class="gallery-item"><img src="1.png" alt="Photo 1"></div>
      <div class="gallery-item"><img src="2.png" alt="Photo 2"></div>
      <div class="gallery-item"><img src="3.png" alt="Photo 3"></div>
      <div class="gallery-item"><img src="4.png" alt="Photo 4"></div>
      <div class="gallery-item"><img src="5.png" alt="Photo 5"></div>
    </div>
  </div>

  <script>
    const PASSWORD = "viva yohanna";

    // Étoiles animées
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 60; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = Math.random() * 4 + 's';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      starsEl.appendChild(s);
    }

    function checkPassword() {
      const input = document.getElementById('password-input');
      const error = document.getElementById('password-error');
      if (input.value === PASSWORD) {
        document.getElementById('password-container').style.display = 'none';
        document.getElementById('gallery-container').style.display = 'block';
      } else {
        error.style.display = 'block';
        input.classList.add('error');
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 400);
      }
    }
  </script>
</body>
</html>
